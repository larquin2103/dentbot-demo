[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Node 20 o superior es obligatorio desde que entró vite-plugin-pwa: su cadena
  # workbox-build → @rollup/plugin-terser → serialize-javascript usa el `crypto`
  # global, que en Node 18 no existe y rompe el build con "crypto is not defined".
  # Se fija 22 porque además Node 18 y 20 ya están fuera de soporte.
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"