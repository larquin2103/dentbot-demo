<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/tooth-icon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Panel de atención y agenda clínica - Clínica Dental Sonrisa Perfecta" />
    <meta name="theme-color" content="#0E4F66" />

    <!-- Instalación en el teléfono. Safari ignora buena parte del manifest y
         necesita sus propias etiquetas; `mobile-web-app-capable` es la versión
         estándar de la de Apple, y se declaran las dos a propósito.
         La barra de estado se deja en `default`: con `black-translucent` el
         texto sale blanco y quedaría ilegible sobre el header del tema claro. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SonrieBot" />
    <title>Clínica Dental Sonrisa Perfecta · Panel</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
